<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OCCT Import - STEP Viewer</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { overflow: hidden; }
      #file-input {
        position: absolute;
        z-index: 10;
        top: 10px;
        left: 10px;
      }
      #stats {
        position: absolute;
        z-index: 10;
        top: 10px;
        right: 10px;
        background: rgba(0,0,0,0.7);
        color: #fff;
        padding: 10px;
        font-family: monospace;
        font-size: 12px;
      }
      #canvas {
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <input id="file-input" type="file" accept=".stp,.step,.STEP,.STP" />
    <div id="stats"></div>
    <canvas id="canvas"></canvas>
    <script type="module" src="/src/occt-viewer.ts"></script>
  </body>
</html>
