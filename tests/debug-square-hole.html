<!DOCTYPE html>
<html>
<head>
  <title>Debug Square with Hole</title>
  <style>
    body { font-family: monospace; padding: 20px; }
    pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
    .error { color: red; }
    .success { color: green; }
  </style>
</head>
<body>
  <h1>Debug: Square with Triangle Hole</h1>
  <div id="output">Loading...</div>

  <script type="module">
    import { bridgeAllHoles, normalizeWinding, computeFaceBasisFromLoop, projectFaceLoopsTo2D, applyWindingTo3D } from '../src/step-parser.ts';

    const output = document.getElementById('output');

    function log(msg) {
      output.innerHTML += msg + '\n';
    }

    async function runTest() {
      output.innerHTML = '<pre>';

      // Square vertices (CCW): (0,0), (4,0), (4,4), (0,4)
      const outer3d = [
        [0, 0, 0],
        [4, 0, 0],
        [4, 4, 0],
        [0, 4, 0]
      ];

      // Triangle hole vertices (assuming CCW in STEP, will be normalized to CW)
      // Vertices: (1,1), (3,1), (2,3)
      const hole3d = [
        [1, 1, 0],
        [3, 1, 0],
        [2, 3, 0]
      ];

      log('=== INPUT ===');
      log(`Outer (3D): ${JSON.stringify(outer3d)}`);
      log(`Hole (3D): ${JSON.stringify(hole3d)}`);
      log('');

      // Step 1: Compute face basis
      const basis = computeFaceBasisFromLoop(outer3d);
      log(`Basis origin: ${JSON.stringify(basis.origin)}`);
      log(`Basis u: ${JSON.stringify(basis.u)}`);
      log(`Basis v: ${JSON.stringify(basis.v)}`);
      log('');

      // Step 2: Project to 2D
      const projected = projectFaceLoopsTo2D({ outer: outer3d, holes: [hole3d] }, basis);
      log(`Outer (2D): ${JSON.stringify(projected.outer2d)}`);
      log(`Hole (2D): ${JSON.stringify(projected.holes2d[0])}`);
      log('');

      // Step 3: Normalize winding (CCW outer, CW holes)
      const normalized = normalizeWinding(projected);
      log(`Normalized outer (2D): ${JSON.stringify(normalized.outer2d)}`);
      log(`Outer reversed: ${normalized.outerReversed}`);
      log(`Normalized hole (2D): ${JSON.stringify(normalized.holes2d[0])}`);
      log(`Hole reversed: ${JSON.stringify(normalized.holesReversed)}`);
      log('');

      // Step 4: Bridge holes
      log('=== BRIDGING ===');
      const merged = bridgeAllHoles(normalized.outer2d, normalized.holes2d);
      log(`Merged polygon vertices: ${merged.length}`);
      log(`Expected: 9 (4 outer + 3 hole + 2 bridge duplicates)`);
      log('');

      // Show all merged vertices
      log('Merged vertices:');
      for (let i = 0; i < merged.length; i++) {
        log(`  [${i}]: (${merged[i][0].toFixed(2)}, ${merged[i][1].toFixed(2)})`);
      }
      log('');

      // Expected triangles
      const expectedTriangles = merged.length - 2;
      log(`Expected triangles from ${merged.length} vertices: ${expectedTriangles}`);

      if (merged.length === 9) {
        log('<span class="success">PASS: Correct vertex count</span>');
      } else {
        log(`<span class="error">FAIL: Got ${merged.length} vertices, expected 9</span>`);
      }

      output.innerHTML += '</pre>';
    }

    runTest().catch(err => {
      output.innerHTML = `<pre class="error">Error: ${err.message}\n${err.stack}</pre>`;
    });
  </script>
</body>
</html>
