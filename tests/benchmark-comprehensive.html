<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OCC Tessellator Benchmarks</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #eee; }
        .pass { color: #4ade80; }
        .fail { color: #f87171; }
        .info { color: #60a5fa; }
        .warn { color: #fbbf24; }
        #log { white-space: pre-wrap; max-height: 600px; overflow-y: auto; }
        table { border-collapse: collapse; margin: 20px 0; }
        th, td { border: 1px solid #444; padding: 8px 12px; text-align: right; }
        th { background: #333; }
        .faster { color: #4ade80; }
        .slower { color: #f87171; }
    </style>
</head>
<body>
    <h1>OCC Tessellator Benchmark Suite</h1>
    <p>Comparing: OpenCascade.js + GPU Tessellation vs occt-import-js</p>
    <div id="status">Initializing...</div>
    <div id="log"></div>
    <div id="results"></div>

    <script type="module">
        import { parseStepFile } from '/src/tessellator.ts';
        import {
            tessellationProfile,
            resetTessellationProfile,
            getTessellationProfileReport,
            getLocalUvClassifierTelemetry,
            parseStepWithOcctImportSimple
        } from '/src/occ-test.ts';
        import { getGPUDevice } from '/src/lib.ts';

        // Expose benchmark functions to window for Puppeteer access
        window.benchmark = {
            // Parse with our OCC + GPU pipeline
            async runOCC(stepContent) {
                try {
                    resetTessellationProfile();
                    const startTime = performance.now();

                    let content = stepContent;
                    if (typeof stepContent === 'string') {
                        content = new TextEncoder().encode(stepContent);
                    }

                    // Perf benchmark mode: geometry-only load path (no XCAF/color parsing).
                    const prevPerfGeometryOnly = globalThis.__PERF_GEOMETRY_ONLY_LOAD__;
                    const prevEnableXCAF = globalThis.__ENABLE_XCAF_READER__;
                    const prevEnableStepColorParsing = globalThis.__ENABLE_STEP_COLOR_PARSING__;
                    const prevEnableLoadDiagnostics = globalThis.__ENABLE_LOAD_DIAGNOSTICS__;
                    const prevCurveVerbose = globalThis.__CURVE_VERBOSE_LOGS__;
                    const prevTessVerbose = globalThis.__TESSELLATION_VERBOSE_LOGS__;
                    const prevTriFastGpuPriority = globalThis.__TRI_FAST_GPU_PRIORITY__;
                    const prevDetailedTessProfile = globalThis.__ENABLE_DETAILED_TESSELLATION_PROFILING__;
                    const prevLocalUvClassifierShadow = globalThis.__ENABLE_LOCAL_UV_CLASSIFIER_SHADOW__;
                    const prevLocalUvClassifierCandidate = globalThis.__ENABLE_LOCAL_UV_CLASSIFIER_CANDIDATE__;
                    const prevLocalUvClassifierFallback = globalThis.__LOCAL_UV_CLASSIFIER_FALLBACK_TO_OCC__;
                    const prevLocalUvClassifierCandidateStrict = globalThis.__LOCAL_UV_CLASSIFIER_CANDIDATE_STRICT__;
                    const prevGridBatchTargetJobs = globalThis.__GPU_SURFACE_GRID_BATCH_TARGET_JOBS__;
                    const prevGridBatchTargetVerts = globalThis.__GPU_SURFACE_GRID_BATCH_TARGET_VERTS__;
                    const prevGridBatchDelayMs = globalThis.__GPU_SURFACE_GRID_BATCH_DELAY_MS__;
                    const prevEvalBatchTargetJobs = globalThis.__GPU_SURFACE_EVAL_BATCH_TARGET_JOBS__;
                    const prevEvalBatchTargetVerts = globalThis.__GPU_SURFACE_EVAL_BATCH_TARGET_VERTS__;
                    const prevEvalBatchDelayMs = globalThis.__GPU_SURFACE_EVAL_BATCH_DELAY_MS__;
                    const enableDetailedTessProfile = globalThis.__BENCH_DETAILED_PROFILE__ === true;
                    const enableLocalUvClassifierShadow = globalThis.__BENCH_ENABLE_LOCAL_UV_CLASSIFIER_SHADOW__ === true;
                    const enableLocalUvClassifierCandidate = globalThis.__BENCH_ENABLE_LOCAL_UV_CLASSIFIER_CANDIDATE__ === true;
                    const enableLocalUvClassifierCandidateStrict = globalThis.__BENCH_ENABLE_LOCAL_UV_CLASSIFIER_CANDIDATE_STRICT__ === true;
                    const disableLocalUvClassifierFallback = globalThis.__BENCH_DISABLE_LOCAL_UV_CLASSIFIER_FALLBACK__ === true;
                    globalThis.__PERF_GEOMETRY_ONLY_LOAD__ = true;
                    globalThis.__ENABLE_XCAF_READER__ = false;
                    globalThis.__ENABLE_STEP_COLOR_PARSING__ = false;
                    globalThis.__ENABLE_LOAD_DIAGNOSTICS__ = false;
                    globalThis.__CURVE_VERBOSE_LOGS__ = false;
                    globalThis.__TESSELLATION_VERBOSE_LOGS__ = false;
                    globalThis.__TRI_FAST_GPU_PRIORITY__ = true;
                    globalThis.__ENABLE_DETAILED_TESSELLATION_PROFILING__ = enableDetailedTessProfile;
                    globalThis.__ENABLE_LOCAL_UV_CLASSIFIER_SHADOW__ = enableLocalUvClassifierShadow;
                    globalThis.__ENABLE_LOCAL_UV_CLASSIFIER_CANDIDATE__ = enableLocalUvClassifierCandidate;
                    globalThis.__LOCAL_UV_CLASSIFIER_FALLBACK_TO_OCC__ = !disableLocalUvClassifierFallback;
                    globalThis.__LOCAL_UV_CLASSIFIER_CANDIDATE_STRICT__ = enableLocalUvClassifierCandidateStrict;
                    // Keep dense/sparse surface eval in model-wide coalescing mode so
                    // curved-trimmed faces are packed into one/few GPU submissions.
                    globalThis.__GPU_SURFACE_GRID_BATCH_TARGET_JOBS__ = 1024;
                    globalThis.__GPU_SURFACE_GRID_BATCH_TARGET_VERTS__ = 2_000_000;
                    globalThis.__GPU_SURFACE_GRID_BATCH_DELAY_MS__ = 8;
                    globalThis.__GPU_SURFACE_EVAL_BATCH_TARGET_JOBS__ = 1024;
                    globalThis.__GPU_SURFACE_EVAL_BATCH_TARGET_VERTS__ = 2_000_000;
                    globalThis.__GPU_SURFACE_EVAL_BATCH_DELAY_MS__ = 8;

                    let mesh;
                    try {
                        mesh = await parseStepFile(content);
                    } finally {
                        if (prevPerfGeometryOnly === undefined) {
                            delete globalThis.__PERF_GEOMETRY_ONLY_LOAD__;
                        } else {
                            globalThis.__PERF_GEOMETRY_ONLY_LOAD__ = prevPerfGeometryOnly;
                        }
                        if (prevEnableXCAF === undefined) {
                            delete globalThis.__ENABLE_XCAF_READER__;
                        } else {
                            globalThis.__ENABLE_XCAF_READER__ = prevEnableXCAF;
                        }
                        if (prevEnableStepColorParsing === undefined) {
                            delete globalThis.__ENABLE_STEP_COLOR_PARSING__;
                        } else {
                            globalThis.__ENABLE_STEP_COLOR_PARSING__ = prevEnableStepColorParsing;
                        }
                        if (prevEnableLoadDiagnostics === undefined) {
                            delete globalThis.__ENABLE_LOAD_DIAGNOSTICS__;
                        } else {
                            globalThis.__ENABLE_LOAD_DIAGNOSTICS__ = prevEnableLoadDiagnostics;
                        }
                        if (prevCurveVerbose === undefined) {
                            delete globalThis.__CURVE_VERBOSE_LOGS__;
                        } else {
                            globalThis.__CURVE_VERBOSE_LOGS__ = prevCurveVerbose;
                        }
                        if (prevTessVerbose === undefined) {
                            delete globalThis.__TESSELLATION_VERBOSE_LOGS__;
                        } else {
                            globalThis.__TESSELLATION_VERBOSE_LOGS__ = prevTessVerbose;
                        }
                        if (prevTriFastGpuPriority === undefined) {
                            delete globalThis.__TRI_FAST_GPU_PRIORITY__;
                        } else {
                            globalThis.__TRI_FAST_GPU_PRIORITY__ = prevTriFastGpuPriority;
                        }
                        if (prevDetailedTessProfile === undefined) {
                            delete globalThis.__ENABLE_DETAILED_TESSELLATION_PROFILING__;
                        } else {
                            globalThis.__ENABLE_DETAILED_TESSELLATION_PROFILING__ = prevDetailedTessProfile;
                        }
                        if (prevLocalUvClassifierShadow === undefined) {
                            delete globalThis.__ENABLE_LOCAL_UV_CLASSIFIER_SHADOW__;
                        } else {
                            globalThis.__ENABLE_LOCAL_UV_CLASSIFIER_SHADOW__ = prevLocalUvClassifierShadow;
                        }
                        if (prevLocalUvClassifierCandidate === undefined) {
                            delete globalThis.__ENABLE_LOCAL_UV_CLASSIFIER_CANDIDATE__;
                        } else {
                            globalThis.__ENABLE_LOCAL_UV_CLASSIFIER_CANDIDATE__ = prevLocalUvClassifierCandidate;
                        }
                        if (prevLocalUvClassifierFallback === undefined) {
                            delete globalThis.__LOCAL_UV_CLASSIFIER_FALLBACK_TO_OCC__;
                        } else {
                            globalThis.__LOCAL_UV_CLASSIFIER_FALLBACK_TO_OCC__ = prevLocalUvClassifierFallback;
                        }
                        if (prevLocalUvClassifierCandidateStrict === undefined) {
                            delete globalThis.__LOCAL_UV_CLASSIFIER_CANDIDATE_STRICT__;
                        } else {
                            globalThis.__LOCAL_UV_CLASSIFIER_CANDIDATE_STRICT__ = prevLocalUvClassifierCandidateStrict;
                        }
                        if (prevGridBatchTargetJobs === undefined) {
                            delete globalThis.__GPU_SURFACE_GRID_BATCH_TARGET_JOBS__;
                        } else {
                            globalThis.__GPU_SURFACE_GRID_BATCH_TARGET_JOBS__ = prevGridBatchTargetJobs;
                        }
                        if (prevGridBatchTargetVerts === undefined) {
                            delete globalThis.__GPU_SURFACE_GRID_BATCH_TARGET_VERTS__;
                        } else {
                            globalThis.__GPU_SURFACE_GRID_BATCH_TARGET_VERTS__ = prevGridBatchTargetVerts;
                        }
                        if (prevGridBatchDelayMs === undefined) {
                            delete globalThis.__GPU_SURFACE_GRID_BATCH_DELAY_MS__;
                        } else {
                            globalThis.__GPU_SURFACE_GRID_BATCH_DELAY_MS__ = prevGridBatchDelayMs;
                        }
                        if (prevEvalBatchTargetJobs === undefined) {
                            delete globalThis.__GPU_SURFACE_EVAL_BATCH_TARGET_JOBS__;
                        } else {
                            globalThis.__GPU_SURFACE_EVAL_BATCH_TARGET_JOBS__ = prevEvalBatchTargetJobs;
                        }
                        if (prevEvalBatchTargetVerts === undefined) {
                            delete globalThis.__GPU_SURFACE_EVAL_BATCH_TARGET_VERTS__;
                        } else {
                            globalThis.__GPU_SURFACE_EVAL_BATCH_TARGET_VERTS__ = prevEvalBatchTargetVerts;
                        }
                        if (prevEvalBatchDelayMs === undefined) {
                            delete globalThis.__GPU_SURFACE_EVAL_BATCH_DELAY_MS__;
                        } else {
                            globalThis.__GPU_SURFACE_EVAL_BATCH_DELAY_MS__ = prevEvalBatchDelayMs;
                        }
                    }

                    const totalTime = performance.now() - startTime;

                    // Extract phase timings from profile
                    const profile = tessellationProfile;
                    const phases = Object.fromEntries(
                        Object.entries(profile).map(([name, data]) => [
                            name,
                            Number.isFinite(data?.total) ? data.total : 0,
                        ])
                    );
                    const phaseCalls = Object.fromEntries(
                        Object.entries(profile).map(([name, data]) => [
                            name,
                            Number.isFinite(data?.calls) ? data.calls : 0,
                        ])
                    );

                    return {
                        success: true,
                        totalTime,
                        vertexCount: mesh.positions.length / 3,
                        triangleCount: mesh.indices.length / 3,
                        hasNormals: !!mesh.normals,
                        hasColors: !!mesh.vertexColors,
                        phases,
                        phaseCalls,
                        localUvClassifier: getLocalUvClassifierTelemetry(),
                        profileReport: getTessellationProfileReport()
                    };
                } catch (e) {
                    return { success: false, error: e.message + '\n' + e.stack };
                }
            },

            // Parse with occt-import-js
            async runOcctImport(stepContent) {
                try {
                    const result = await parseStepWithOcctImportSimple(stepContent);
                    return {
                        success: result.success,
                        totalTime: result.totalTime,
                        vertexCount: result.vertexCount,
                        triangleCount: result.triangleCount,
                        meshCount: result.meshCount,
                    };
                } catch (e) {
                    return { success: false, error: e.message };
                }
            },

            // Check WebGPU
            async checkWebGPU() {
                try {
                    const device = await getGPUDevice();
                    return { available: true };
                } catch (e) {
                    return { available: false, error: e.message };
                }
            },

            // occt-import-js is initialized lazily via parseStepWithOcctImportSimple
            async init() {
                return { ready: true };
            }
        };

        // Log function
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const span = document.createElement('span');
            span.className = type;
            span.textContent = message + '\n';
            logDiv.appendChild(span);
            console.log(message);
        }

        // Initialize
        async function init() {
            const statusDiv = document.getElementById('status');

            try {
                // Check WebGPU
                const gpuResult = await window.benchmark.checkWebGPU();
                if (!gpuResult.available) {
                    statusDiv.innerHTML = '<span class="fail">WebGPU not available: ' + gpuResult.error + '</span>';
                    return;
                }
                log('WebGPU available', 'pass');

                // Initialize occt-import-js
                await window.benchmark.init();
                log('occt-import-js initialized', 'pass');

                statusDiv.innerHTML = '<span class="pass">Ready for benchmarks</span>';
                window.benchmarkReady = true;
                log('Benchmark harness ready', 'pass');
            } catch (e) {
                statusDiv.innerHTML = '<span class="fail">Initialization failed: ' + e.message + '</span>';
                log('Error: ' + e.message, 'fail');
            }
        }

        init();
    </script>
</body>
</html>
