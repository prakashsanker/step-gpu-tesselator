<!DOCTYPE html>
<html>
<head>
  <title>Check OpenCascade.js APIs</title>
  <style>
    body { font-family: monospace; padding: 20px; }
    pre { background: #f0f0f0; padding: 10px; overflow: auto; }
    h2 { margin-top: 20px; }
  </style>
</head>
<body>
  <h1>OpenCascade.js API Check</h1>
  <div id="status">Loading OpenCascade.js...</div>
  <pre id="output"></pre>

  <script type="module">
    const output = document.getElementById('output');
    const status = document.getElementById('status');

    function log(msg) {
      output.textContent += msg + '\n';
      console.log(msg);
    }

    async function checkAPIs() {
      try {
        status.textContent = 'Initializing OpenCascade.js...';
        const opencascadeModule = await import('opencascade.js/dist/opencascade.wasm.js');
        const initOpenCascade = opencascadeModule.default;
        const oc = await initOpenCascade();
        status.textContent = 'OpenCascade.js loaded!';

        // Check what STEP reader APIs are available
        const stepApis = Object.keys(oc).filter(k =>
          k.includes('STEP') || k.includes('XSControl') || k.includes('Transfer')
        );

        log('=== STEP/Transfer/XSControl related APIs ===');
        stepApis.sort().forEach(api => log(api));

        // Check STEPCAFControl_Reader methods
        log('\n=== STEPCAFControl_Reader_1 prototype methods ===');
        if (oc.STEPCAFControl_Reader_1) {
          const reader = new oc.STEPCAFControl_Reader_1();
          const proto = Object.getPrototypeOf(reader);
          const methods = Object.getOwnPropertyNames(proto).filter(m => typeof reader[m] === 'function');
          methods.sort().forEach(m => log('  ' + m));

          // Check if Reader() method exists
          if (reader.Reader) {
            log('\n=== reader.Reader() (STEPControl_Reader) methods ===');
            try {
              const innerReader = reader.Reader();
              const innerProto = Object.getPrototypeOf(innerReader);
              const innerMethods = Object.getOwnPropertyNames(innerProto).filter(m => typeof innerReader[m] === 'function');
              innerMethods.sort().forEach(m => log('  ' + m));

              // Check if WS() exists
              if (innerReader.WS) {
                log('\n=== innerReader.WS() (XSControl_WorkSession) methods ===');
                const ws = innerReader.WS();
                const wsProto = Object.getPrototypeOf(ws);
                const wsMethods = Object.getOwnPropertyNames(wsProto).filter(m => typeof ws[m] === 'function');
                wsMethods.sort().forEach(m => log('  ' + m));

                // Check TransferReader
                if (ws.TransferReader) {
                  log('\n=== ws.TransferReader() methods ===');
                  const tr = ws.TransferReader();
                  const trProto = Object.getPrototypeOf(tr);
                  const trMethods = Object.getOwnPropertyNames(trProto).filter(m => typeof tr[m] === 'function');
                  trMethods.sort().forEach(m => log('  ' + m));

                  // Check TransientProcess
                  if (tr.TransientProcess) {
                    log('\n=== tr.TransientProcess() (Transfer_TransientProcess) methods ===');
                    const tp = tr.TransientProcess();
                    const tpProto = Object.getPrototypeOf(tp);
                    const tpMethods = Object.getOwnPropertyNames(tpProto).filter(m => typeof tp[m] === 'function');
                    tpMethods.sort().forEach(m => log('  ' + m));

                    // Check key methods we need
                    log('\n=== KEY METHODS CHECK ===');
                    log('TransientProcess.MapIndex: ' + (typeof tp.MapIndex === 'function'));
                    log('TransientProcess.MapItem: ' + (typeof tp.MapItem === 'function'));
                    log('TransientProcess.NbMapped: ' + (typeof tp.NbMapped === 'function'));
                    log('TransientProcess.Mapped: ' + (typeof tp.Mapped === 'function'));
                    log('TransientProcess.Find: ' + (typeof tp.Find === 'function'));
                    log('TransientProcess.FindTransient: ' + (typeof tp.FindTransient === 'function'));
                  } else {
                    log('\n*** TransferReader does NOT have TransientProcess method ***');
                  }
                } else {
                  log('\n*** WorkSession does NOT have TransferReader method ***');
                }
              } else {
                log('\n*** STEPControl_Reader does NOT have WS method ***');
              }
            } catch (e) {
              log('Error accessing inner reader: ' + e);
            }
          } else {
            log('\n*** STEPCAFControl_Reader does NOT have Reader method ***');
          }

          reader.delete();
        } else {
          log('\n*** STEPCAFControl_Reader_1 not found ***');
        }

        log('\n=== Done ===');

      } catch (err) {
        status.textContent = 'Error: ' + err.message;
        log('ERROR: ' + err);
        console.error(err);
      }
    }

    checkAPIs();
  </script>
</body>
</html>
