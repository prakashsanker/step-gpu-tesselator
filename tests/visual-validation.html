<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visual Validation - Algorithm Comparison</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
            margin: 0;
            padding: 20px;
            background: #1a1a1a;
            color: #eee;
        }
        h1 { margin-top: 0; }
        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .controls select, .controls button, .controls input {
            padding: 8px 12px;
            font-size: 14px;
            border-radius: 4px;
            border: 1px solid #444;
            background: #333;
            color: #eee;
        }
        .controls button {
            cursor: pointer;
            background: #4a6;
        }
        .controls button:hover { background: #5b7; }
        .controls button:disabled { background: #555; cursor: not-allowed; }

        .render-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .render-panel {
            background: #2a2a2a;
            border-radius: 8px;
            overflow: hidden;
        }
        .render-header {
            padding: 10px;
            background: #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .render-header h3 { margin: 0; font-size: 14px; }
        .render-stats { font-size: 12px; color: #888; }
        .render-canvas {
            width: 100%;
            height: 400px;
            display: block;
        }

        #log {
            background: #222;
            padding: 15px;
            border-radius: 8px;
            max-height: 200px;
            overflow-y: auto;
            font-size: 12px;
            white-space: pre-wrap;
        }
        .log-pass { color: #4ade80; }
        .log-fail { color: #f87171; }
        .log-info { color: #60a5fa; }
        .log-warn { color: #fbbf24; }

        #status {
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 4px;
            background: #333;
        }
        .status-ready { background: #234; }
        .status-loading { background: #432; }
        .status-error { background: #422; }

        .comparison-result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            background: #222;
        }
        .comparison-result h3 { margin-top: 0; }
        .verdict-pass { color: #4ade80; font-weight: bold; }
        .verdict-fail { color: #f87171; font-weight: bold; }
    </style>
</head>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/examples/jsm/controls/OrbitControls.js": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';
        import { parseStepFile } from '/src/tessellator.ts';
        import { parseStepWithOCC, parseStepWithOcctImportFull } from '/src/occ-test.ts';
        import { getGPUDevice } from '/src/lib.ts';

        // State
        let renderers = {};
        let scenes = {};
        let cameras = {};
        let controls = {};
        let currentMeshes = {};

        // Logging
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const span = document.createElement('span');
            span.className = 'log-' + type;
            span.textContent = `[${new Date().toISOString().substr(11, 8)}] ${message}\n`;
            logDiv.appendChild(span);
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(`[${type}] ${message}`);
        }

        function setStatus(message, type = 'loading') {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = 'status-' + type;
        }

        // Initialize Three.js renderers for each canvas
        function initRenderer(canvasId) {
            const canvas = document.getElementById(canvasId);
            const renderer = new THREE.WebGLRenderer({
                canvas,
                antialias: true,
                preserveDrawingBuffer: true, // Needed for screenshots
                logarithmicDepthBuffer: true
            });

            const width = canvas.clientWidth;
            const height = canvas.clientHeight;
            renderer.setSize(width, height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.outputColorSpace = THREE.SRGBColorSpace;

            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x404040);

            const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 10000);
            camera.position.set(5, 5, 5);

            const ctrl = new OrbitControls(camera, renderer.domElement);
            ctrl.enableDamping = true;

            // Lights
            const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
            scene.add(hemiLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 15, 10);
            scene.add(dirLight);

            renderers[canvasId] = renderer;
            scenes[canvasId] = scene;
            cameras[canvasId] = camera;
            controls[canvasId] = ctrl;

            return { renderer, scene, camera, controls: ctrl };
        }

        // Create Three.js mesh from our pipeline output
        function createMeshFromOurPipeline(mesh) {
            const positions = new Float32Array(mesh.positions.length);
            for (let i = 0; i < mesh.positions.length; i += 3) {
                positions[i] = mesh.positions[i];
                positions[i + 1] = mesh.positions[i + 2];
                positions[i + 2] = -mesh.positions[i + 1];
            }

            let normals;
            if (mesh.normals) {
                normals = new Float32Array(mesh.normals.length);
                for (let i = 0; i < mesh.normals.length; i += 3) {
                    normals[i] = mesh.normals[i];
                    normals[i + 1] = mesh.normals[i + 2];
                    normals[i + 2] = -mesh.normals[i + 1];
                }
            }

            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            if (normals) {
                geometry.setAttribute('normal', new THREE.BufferAttribute(normals, 3));
            } else {
                geometry.computeVertexNormals();
            }
            geometry.setIndex(new THREE.BufferAttribute(mesh.indices, 1));

            // Note: We ignore vertex colors for visual comparison to ensure both renders
            // use the same color. This allows fair pixel comparison between our pipeline
            // and occt-import-js reference.
            const material = new THREE.MeshStandardMaterial({
                color: 0x6699ff,  // Same as reference for fair pixel comparison
                metalness: 0.2,
                roughness: 0.5,
                side: THREE.DoubleSide,
            });

            return new THREE.Mesh(geometry, material);
        }

        // Create Three.js mesh from occt-import-js output
        function createMeshFromOcctImport(meshData) {
            const geometry = new THREE.BufferGeometry();

            // occt-import-js provides mesh data in a specific format
            const positions = new Float32Array(meshData.positions.length);
            for (let i = 0; i < meshData.positions.length; i += 3) {
                positions[i] = meshData.positions[i];
                positions[i + 1] = meshData.positions[i + 2];
                positions[i + 2] = -meshData.positions[i + 1];
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            if (meshData.normals && meshData.normals.length > 0) {
                const normals = new Float32Array(meshData.normals.length);
                for (let i = 0; i < meshData.normals.length; i += 3) {
                    normals[i] = meshData.normals[i];
                    normals[i + 1] = meshData.normals[i + 2];
                    normals[i + 2] = -meshData.normals[i + 1];
                }
                geometry.setAttribute('normal', new THREE.BufferAttribute(normals, 3));
            } else {
                geometry.computeVertexNormals();
            }

            if (meshData.indices && meshData.indices.length > 0) {
                geometry.setIndex(new THREE.BufferAttribute(new Uint32Array(meshData.indices), 1));
            }

            const material = new THREE.MeshStandardMaterial({
                color: 0x6699ff,  // Same as our pipeline for pixel comparison
                metalness: 0.2,
                roughness: 0.5,
                side: THREE.DoubleSide,
            });

            return new THREE.Mesh(geometry, material);
        }

        // Fit camera to mesh
        function fitCameraToMesh(canvasId, mesh) {
            mesh.geometry.computeBoundingBox();
            const boundingBox = mesh.geometry.boundingBox;
            const center = new THREE.Vector3();
            boundingBox.getCenter(center);
            const size = new THREE.Vector3();
            boundingBox.getSize(size);

            const maxDim = Math.max(size.x, size.y, size.z);
            const fov = 45;
            const cameraDistance = maxDim / (2 * Math.tan((fov * Math.PI) / 360)) * 2;

            const camera = cameras[canvasId];
            camera.position.set(
                center.x + cameraDistance * 0.7,
                center.y + cameraDistance * 0.7,
                center.z + cameraDistance * 0.7
            );
            camera.lookAt(center);
            camera.near = Math.max(0.1, maxDim * 0.001);
            camera.far = Math.max(1000, cameraDistance * 5);
            camera.updateProjectionMatrix();

            controls[canvasId].target.copy(center);
            controls[canvasId].update();
        }

        // Add mesh to scene
        function setMesh(canvasId, threeMesh) {
            const scene = scenes[canvasId];

            // Remove existing mesh
            if (currentMeshes[canvasId]) {
                scene.remove(currentMeshes[canvasId]);
                currentMeshes[canvasId].geometry.dispose();
                currentMeshes[canvasId].material.dispose();
            }

            scene.add(threeMesh);
            currentMeshes[canvasId] = threeMesh;
            fitCameraToMesh(canvasId, threeMesh);
        }

        // Run comparison
        async function runComparison() {
            const testFile = document.getElementById('testFile').value;
            if (!testFile) {
                log('Please select a test file', 'warn');
                return;
            }

            setStatus('Loading STEP file...', 'loading');
            log(`Loading: ${testFile}`, 'info');

            try {
                // Fetch the STEP file
                const response = await fetch('/' + testFile);
                if (!response.ok) throw new Error(`Failed to load ${testFile}`);
                const stepContent = await response.text();
                log(`Loaded ${(stepContent.length / 1024).toFixed(1)} KB`, 'info');

                // Run our pipeline (ear-clipping) - using tessellator.ts which works correctly
                setStatus('Running our pipeline...', 'loading');
                log('Running our pipeline (ear-clipping)...', 'info');
                const occStart = performance.now();
                const occMesh = await parseStepFile(new TextEncoder().encode(stepContent));
                const occTime = performance.now() - occStart;

                const occThreeMesh = createMeshFromOurPipeline(occMesh);
                setMesh('canvas-occ', occThreeMesh);

                const occStats = `${occMesh.indices.length / 3} tris, ${occTime.toFixed(0)}ms`;
                document.getElementById('stats-occ').textContent = occStats;
                log(`Our pipeline (ear-clipping): ${occStats}`, 'pass');

                // Run CDT pipeline (using OCC parsing with CDT triangulation)
                setStatus('Running CDT pipeline...', 'loading');
                log('Running our pipeline (CDT)...', 'info');
                const cdtStart = performance.now();
                try {
                    const cdtMesh = await parseStepWithOCC(new TextEncoder().encode(stepContent), 'cdt');
                    const cdtTime = performance.now() - cdtStart;

                    const cdtThreeMesh = createMeshFromOurPipeline(cdtMesh);
                    setMesh('canvas-cdt', cdtThreeMesh);

                    const cdtStats = `${cdtMesh.indices.length / 3} tris, ${cdtTime.toFixed(0)}ms`;
                    document.getElementById('stats-cdt').textContent = cdtStats;
                    log(`Our pipeline (CDT): ${cdtStats}`, 'pass');
                } catch (cdtError) {
                    log(`CDT failed: ${cdtError.message}`, 'fail');
                    document.getElementById('stats-cdt').textContent = 'Failed';
                }

                // Run occt-import-js
                setStatus('Running occt-import-js...', 'loading');
                log('Running occt-import-js...', 'info');
                const occtResult = await parseStepWithOcctImportFull(stepContent);

                if (occtResult.success && occtResult.mesh) {
                    const occtThreeMesh = createMeshFromOcctImport(occtResult.mesh);
                    setMesh('canvas-occt', occtThreeMesh);

                    const occtStats = `${occtResult.triangleCount} tris, ${occtResult.totalTime.toFixed(0)}ms`;
                    document.getElementById('stats-occt').textContent = occtStats;
                    log(`occt-import-js: ${occtStats}`, 'pass');
                } else {
                    log(`occt-import-js failed: ${occtResult.error}`, 'fail');
                    document.getElementById('stats-occt').textContent = 'Failed';
                }

                // Show comparison
                const speedup = occtResult.totalTime / occTime;
                showComparison({
                    occ: { triangles: occMesh.indices.length / 3, time: occTime },
                    occt: { triangles: occtResult.triangleCount, time: occtResult.totalTime },
                    speedup
                });

                setStatus('Comparison complete', 'ready');
                log('Comparison complete!', 'pass');

            } catch (error) {
                log(`Error: ${error.message}`, 'fail');
                setStatus(`Error: ${error.message}`, 'error');
            }
        }

        function showComparison(data) {
            const resultDiv = document.getElementById('comparisonResult');
            const detailsDiv = document.getElementById('comparisonDetails');

            const speedupClass = data.speedup >= 1 ? 'verdict-pass' : 'verdict-fail';
            const speedupText = data.speedup >= 1 ? 'FASTER' : 'SLOWER';

            detailsDiv.innerHTML = `
                <table style="width: 100%; border-collapse: collapse;">
                    <tr>
                        <th style="text-align: left; padding: 8px; border-bottom: 1px solid #444;">Metric</th>
                        <th style="text-align: right; padding: 8px; border-bottom: 1px solid #444;">Our Pipeline</th>
                        <th style="text-align: right; padding: 8px; border-bottom: 1px solid #444;">occt-import-js</th>
                    </tr>
                    <tr>
                        <td style="padding: 8px;">Triangles</td>
                        <td style="text-align: right; padding: 8px;">${data.occ.triangles.toLocaleString()}</td>
                        <td style="text-align: right; padding: 8px;">${data.occt.triangles.toLocaleString()}</td>
                    </tr>
                    <tr>
                        <td style="padding: 8px;">Time</td>
                        <td style="text-align: right; padding: 8px;">${data.occ.time.toFixed(0)} ms</td>
                        <td style="text-align: right; padding: 8px;">${data.occt.time.toFixed(0)} ms</td>
                    </tr>
                    <tr>
                        <td style="padding: 8px;">Speedup</td>
                        <td colspan="2" style="text-align: center; padding: 8px;" class="${speedupClass}">
                            ${data.speedup.toFixed(2)}x ${speedupText}
                        </td>
                    </tr>
                </table>
            `;

            resultDiv.style.display = 'block';
        }

        // Capture screenshots
        async function captureScreenshots() {
            const checkpoint = document.getElementById('checkpointName').value || 'baseline';
            const testFile = document.getElementById('testFile').value;
            if (!testFile) {
                log('Please run a comparison first', 'warn');
                return;
            }

            const testName = testFile.split('/').pop().replace('.step', '').replace('.STEP', '');

            log(`Capturing screenshots for ${testName}...`, 'info');

            // Get canvas data URLs
            const canvases = ['canvas-occ', 'canvas-cdt', 'canvas-occt'];
            const labels = ['ear-clip', 'cdt', 'occt-import'];

            for (let i = 0; i < canvases.length; i++) {
                const canvas = document.getElementById(canvases[i]);
                const dataUrl = canvas.toDataURL('image/png');

                // Create download link
                const link = document.createElement('a');
                link.download = `${checkpoint}_${testName}_${labels[i]}.png`;
                link.href = dataUrl;
                link.click();

                log(`Saved: ${link.download}`, 'pass');
            }

            log('Screenshots captured! Check your downloads folder.', 'pass');
        }

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            for (const canvasId of ['canvas-occ', 'canvas-cdt', 'canvas-occt']) {
                if (renderers[canvasId] && scenes[canvasId] && cameras[canvasId]) {
                    controls[canvasId].update();
                    renderers[canvasId].render(scenes[canvasId], cameras[canvasId]);
                }
            }
        }

        // Sync camera controls across all canvases
        let isSyncing = false;  // Prevent recursive sync
        function syncControls(sourceId) {
            if (isSyncing) return;  // Prevent infinite recursion
            isSyncing = true;

            const sourceControls = controls[sourceId];
            const sourceCamera = cameras[sourceId];

            for (const canvasId of ['canvas-occ', 'canvas-cdt', 'canvas-occt']) {
                if (canvasId !== sourceId && controls[canvasId] && cameras[canvasId]) {
                    cameras[canvasId].position.copy(sourceCamera.position);
                    cameras[canvasId].quaternion.copy(sourceCamera.quaternion);
                    controls[canvasId].target.copy(sourceControls.target);
                    controls[canvasId].update();
                }
            }

            isSyncing = false;
        }

        // Initialize
        async function init() {
            setStatus('Initializing...', 'loading');

            try {
                // Check WebGPU
                log('Checking WebGPU...', 'info');
                const device = await getGPUDevice();
                log('WebGPU available', 'pass');

                // Initialize renderers
                log('Initializing Three.js renderers...', 'info');
                for (const canvasId of ['canvas-occ', 'canvas-cdt', 'canvas-occt']) {
                    initRenderer(canvasId);
                }
                log('Renderers initialized', 'pass');

                // Setup control sync
                for (const canvasId of ['canvas-occ', 'canvas-cdt', 'canvas-occt']) {
                    controls[canvasId].addEventListener('change', () => syncControls(canvasId));
                }

                // Start animation loop
                animate();

                // Enable buttons
                document.getElementById('runBtn').disabled = false;
                document.getElementById('captureBtn').disabled = false;

                // Event handlers
                document.getElementById('runBtn').addEventListener('click', runComparison);
                document.getElementById('captureBtn').addEventListener('click', captureScreenshots);

                setStatus('Ready - Select a test file and click Run Comparison', 'ready');
                log('Initialization complete', 'pass');

                // Signal ready for automation
                window.visualValidationReady = true;

            } catch (error) {
                setStatus(`Initialization failed: ${error.message}`, 'error');
                log(`Error: ${error.message}`, 'fail');
            }
        }

        // Expose functions for Puppeteer automation
        window.visualValidation = {
            async runTest(testFilePath) {
                document.getElementById('testFile').value = testFilePath;
                await runComparison();
                // Wait for render to complete
                await new Promise(r => setTimeout(r, 500));
            },

            getCanvasDataUrl(canvasId) {
                const canvas = document.getElementById(canvasId);
                return canvas.toDataURL('image/png');
            },

            getStats() {
                return {
                    occ: document.getElementById('stats-occ').textContent,
                    cdt: document.getElementById('stats-cdt').textContent,
                    occt: document.getElementById('stats-occt').textContent,
                };
            }
        };

        init();
    </script>
</body>
</html>
